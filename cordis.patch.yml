# dsh-remote-anynet bundle patch
#
# 只做一件事：把本插件的代码行挂进插件树。
#
# 行 id 用 remote-anynet，与上游插件包的 remote-mobile 行不冲突；
# 两套同时启用会争抢同一个 remoteWebUiPairing 服务、并重复注册同一批路由，
# 因此安装本插件时应同时卸载/禁用 dsh-remote-mobile（见 README「迁移」一节）。
#
# 这里【不】覆盖 webserver 行：把 host 改成 0.0.0.0 是 profile 层的职责
# （dsh-lan-access 或用户自己的 cordis.patch.yml）。bundle 补丁里的
# `- id: webserver` 会整行替换该行 config，重复覆盖有清掉其它键的风险。
# 本插件改为在启动横幅里检测绑定状态并提示。

- insert:
    - id: remote-anynet
      name: 'dsh-remote-anynet'
      inject: [webServer]
